name: Fetch media
# Downloads and encodes the media listed in media/manifest.json, then commits the files to the same branch.
on:
  push:
    paths: ['media/manifest.json', 'scripts/fetch_media.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fetch-media-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Fetch and encode
        run: python3 scripts/fetch_media.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/assets/video
          if git diff --cached --quiet; then echo "Nothing new"; exit 0; fi
          git commit -m "Media: video moves from media/manifest.json"
          git push
